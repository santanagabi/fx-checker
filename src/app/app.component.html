<!-- ─── Navbar ─────────────────────────────────────────────────────────── -->
<nav class="navbar" role="navigation" aria-label="Navegação principal">
  <div class="nav-container">

    <!-- Logo -->
    <a routerLink="/converter" class="nav-logo" (click)="closeMobileMenu()" aria-label="FX Checker — Início">
      <span class="logo-fx gradient-text">FX</span>
      <span class="logo-checker">Checker</span>
    </a>

    <!-- Links de navegação — *ngFor com RouterLink e RouterLinkActive -->
    <div class="nav-links" [class.open]="mobileMenuOpen" role="menubar">
      <a
        *ngFor="let item of navItems"
        [routerLink]="item.path"
        routerLinkActive="active"
        class="nav-link"
        role="menuitem"
        (click)="closeMobileMenu()"
        [attr.aria-label]="item.label"
      >
        <span class="nav-icon" aria-hidden="true">{{ item.icon }}</span>
        <span class="nav-label">{{ item.label }}</span>
      </a>
    </div>

    <!-- Hamburger (mobile) -->
    <button
      class="hamburger"
      [class.open]="mobileMenuOpen"
      (click)="toggleMobileMenu()"
      [attr.aria-expanded]="mobileMenuOpen"
      aria-label="Abrir menu"
    >
      <span></span>
      <span></span>
      <span></span>
    </button>

  </div>
</nav>

<!-- Overlay para fechar menu mobile -->
<div
  class="nav-overlay"
  *ngIf="mobileMenuOpen"
  (click)="closeMobileMenu()"
  aria-hidden="true"
></div>

<!-- ─── Conteúdo da Página ──────────────────────────────────────────────── -->
<!-- RouterOutlet: renderiza o componente correspondente à rota atual -->
<main>
  <router-outlet />
</main>
