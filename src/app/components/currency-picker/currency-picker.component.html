<div class="currency-picker" [class.open]="isOpen" [class.disabled]="disabled">

  <!-- Botão trigger que abre/fecha o dropdown -->
  <button
    type="button"
    class="picker-trigger"
    (click)="toggle()"
    [disabled]="disabled"
    [attr.aria-expanded]="isOpen"
    aria-haspopup="listbox"
    [attr.aria-label]="'Moeda selecionada: ' + (selectedCurrency?.name ?? 'Nenhuma')"
  >
    <span class="flag">{{ getFlag(selected) }}</span>
    <span class="code">{{ selected || '—' }}</span>
    <span class="name">{{ selectedCurrency?.name || 'Selecionar moeda' }}</span>
    <svg class="chevron" [class.rotate]="isOpen" viewBox="0 0 24 24" width="16" height="16" fill="none">
      <path d="M7 10l5 5 5-5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </button>

  <!-- Dropdown: *ngIf — só renderiza quando isOpen é true -->
  <div class="dropdown" *ngIf="isOpen" role="listbox" aria-label="Lista de moedas">

    <!-- Campo de busca com debounceTime via formControl -->
    <div class="search-wrapper">
      <svg class="search-icon" viewBox="0 0 24 24" width="14" height="14" fill="none">
        <circle cx="11" cy="11" r="8" stroke="currentColor" stroke-width="2"/>
        <path d="m21 21-4.35-4.35" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      </svg>
      <input
        #searchInput
        type="text"
        class="search-input"
        placeholder="Buscar moeda ou código..."
        [formControl]="searchControl"
        aria-label="Buscar moeda"
        (keydown.escape)="isOpen = false"
      />
    </div>

    <!-- Lista de moedas filtradas -->
    <!-- *ngFor com trackBy: reutiliza nós DOM existentes, melhora performance -->
    <ul class="currency-list">
      <li
        *ngFor="let currency of filteredCurrencies; trackBy: trackByCurrencyCode"
        class="currency-option"
        [class.selected]="currency.code === selected"
        role="option"
        [attr.aria-selected]="currency.code === selected"
        (click)="select(currency.code)"
        (keydown.enter)="select(currency.code)"
        (keydown.space)="$event.preventDefault(); select(currency.code)"
        tabindex="0"
      >
        <span class="opt-flag">{{ getFlag(currency.code) }}</span>
        <div class="opt-info">
          <span class="opt-code">{{ currency.code }}</span>
          <span class="opt-name">{{ currency.name }}</span>
        </div>
        <!-- *ngIf: renderiza o check apenas na moeda selecionada -->
        <svg *ngIf="currency.code === selected" class="check-icon" viewBox="0 0 24 24" width="14" height="14" fill="none">
          <path d="m5 13 4 4L19 7" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </li>

      <!-- Estado vazio: *ngIf quando nenhuma moeda bate com a busca -->
      <li *ngIf="filteredCurrencies.length === 0" class="no-results">
        Nenhuma moeda encontrada para
        "<strong>{{ searchControl.value }}</strong>"
      </li>
    </ul>

  </div>
</div>
